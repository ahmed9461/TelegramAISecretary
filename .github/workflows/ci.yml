name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Ruff full gate
        run: ruff check app tests scripts alembic/versions
      - run: python -m compileall -q app tests scripts alembic/versions
      - run: pytest
      - name: Validate Compose and build production image
        if: matrix.python-version == '3.12'
        run: |
          cp .env.example .env
          docker compose config -q
          docker build --tag telegram-ai-secretary:ci .

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      # Block only correctness-critical Ruff findings for now. The imported M4 baseline
      # contains formatting/style debt (mostly E501/I001/UP017) that is unrelated to M5.
      - name: Ruff correctness gate
        run: ruff check app tests --select E9,F63,F7,F82
      - name: Ruff full report
        run: ruff check app tests --exit-zero
      - run: python -m compileall -q app tests
      - run: pytest

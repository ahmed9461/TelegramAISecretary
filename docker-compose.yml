name: telegram_ai_secretary

x-app-common: &app-common
  build:
    context: .
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-secretary}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-secretary}
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secretary}
      POSTGRES_USER: ${POSTGRES_USER:-secretary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - secretary_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secretary} -d ${POSTGRES_DB:-secretary}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-secretary}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-secretary}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-common
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 5

  bot:
    <<: *app-common
    command: ["python", "-m", "app.telegram.run"]

volumes:
  secretary_pg:
